name: AI Code Review with Google

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai_code_review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets aren't available to fork PRs, so skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - name: AI Code Review
      # Pinned to the commit of tag v1.0 (third-party action receives the token).
      uses: AleksandrFurmenkovOfficial/ai-code-review@1d75404db7d56026c81700b5b8e5e8c613234e69 # v1.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        owner: ${{ github.repository_owner }}
        repo: ${{ github.event.repository.name }}
        pr_number: ${{ github.event.number }}
        
        ai_provider: 'google'
        google_api_key: ${{ secrets.GOOGLE_API_KEY }}
        google_model: 'gemini-3-flash-preview'
