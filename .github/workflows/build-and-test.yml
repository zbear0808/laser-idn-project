name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
      with:
        cli: '1.12.4.1582'

    - name: Cache Maven dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-

    # Fails only on kondo errors; warnings are reported but don't block.
    # dev/ is not linted yet: dev/cljfx/dev/help.clj is an in-ns override of
    # cljfx.dev internals that kondo can't resolve.
    - name: Lint (clj-kondo)
      run: clojure -M:kondo --lint src test --parallel --fail-level error

  # Same headless UI suite on macOS and Windows, so platform-specific input
  # (Cmd vs Ctrl shortcuts) and native JavaFX libraries are covered.
  ui-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac-arm
            shell: bash
          - os: windows-latest
            platform: win
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    # `shell` can't take an expression on a step (GitHub rejects the whole
    # workflow file), but `matrix` is allowed in `defaults.run`.
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
      with:
        cli: '1.12.4.1582'

    - name: Cache Maven dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-

    - name: Run headless UI tests
      run: clojure '-M:${{ matrix.platform }}:test-ui:test-ui-headless'

    # The add-on loader's tests (output drivers D3) on macOS and Windows too,
    # where jars get locked, paths have drive letters and folders have their
    # own hidden files; the rest of the unit suite runs on Ubuntu only.
    # -n loads just that namespace. :test-ui-headless keeps JavaFX headless
    # in case anything it loads pulls in cljfx. Runs even when the UI tests
    # failed. The same quoting works in bash and pwsh (clojure.exe on Windows).
    - name: Run add-on loader tests
      if: ${{ !cancelled() }}
      run: clojure '-M:${{ matrix.platform }}:test:test-ui-headless' -n laser-show.output.addons-test

    - name: Upload UI test results and screenshots
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ui-test-results-${{ matrix.platform }}
        path: test-results/
        if-no-files-found: ignore
        retention-days: 14

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    # Checkout repository
    - name: Checkout code
      uses: actions/checkout@v7
    
    # Setup Java
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    
    # Setup Clojure
    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
      with:
        cli: '1.12.4.1582'
    
    # Cache Clojure dependencies
    - name: Cache Maven dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-
    
    # Run tests (need :linux for JavaFX deps on ubuntu). cljfx starts JavaFX as
    # soon as it loads and the runner has no display, so every test step uses
    # JavaFX's headless platform (the :test-ui-headless alias).
    - name: Run unit tests
      run: clojure -M:linux:test:test-ui-headless
    
    - name: Run integration tests
      run: clojure -M:linux:test-integration:test-ui-headless

    # TestFX UI tests on JavaFX's built-in headless platform: no display or
    # Xvfb needed.
    - name: Run headless UI tests
      timeout-minutes: 10
      run: clojure -M:linux:test-ui:test-ui-headless

    # UI tests write screenshots and other artifacts to test-results/.
    - name: Upload UI test results and screenshots
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ui-test-results
        path: test-results/
        if-no-files-found: ignore
        retention-days: 14
    
    # Build application (platform-specific JAR). AOT-compiling laser-show.app
    # loads JavaFX classes, so run under Xvfb like the release workflow does.
    - name: Build JAR
      run: xvfb-run -a clojure -T:build uber :platform :linux
    
    # Upload JAR artifact
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v7
      with:
        name: laser-show-jar
        path: target/laser-show-*-standalone.jar
        retention-days: 30
