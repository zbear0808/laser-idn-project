name: Build and Test

on:
  push:
    branches: [ master ]
    # A push or PR that only changes notes, docs or agent files runs
    # nothing: no test, the build or the app reads them.
    paths-ignore: &docs-only
      - 'plans/**'
      - 'docs/**'
      - 'prompts/**'
      - '.agents/**'
      - '.opencode/**'
      - '**.md'
  pull_request:
    branches: [ master ]
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
      with:
        cli: '1.12.4.1582'

    - name: Cache Maven dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-

    # Fails only on kondo errors; warnings are reported but don't block.
    # dev/ is not linted yet: dev/cljfx/dev/help.clj is an in-ns override of
    # cljfx.dev internals that kondo can't resolve.
    - name: Lint (clj-kondo)
      run: clojure -M:kondo --lint src test --parallel --fail-level error

  # The headless UI suite on macOS, Windows and Linux, so platform-specific
  # input (Cmd vs Ctrl shortcuts) and native JavaFX libraries are covered.
  # Each OS runs it as 4 jobs at once, each with a quarter of the tests
  # (laser-show.test-runner --shard: every 4th test, so each quarter has
  # some of every namespace and they take about as long as each other).
  # Measured at 355 UI tests (run 45254112881, 2026-11-23), the whole suite
  # takes about 72 min on macOS, 17 on Windows and 14 on Linux: every test
  # runs about 5x slower on the macOS runner than on Linux. No test waits out
  # a timeout; the runner is slow. So a quarter takes about 18, 4.5 and 3.5
  # min. The limits leave room for a slow day and a growing suite, and still
  # stop a hang.
  # More shards: add to `shard` and change `shards` to match. GitHub's free
  # plan runs at most 5 macOS jobs at once, across all of an account's repos.
  # `skip`: tests tagged with it fail on this OS's runner for a reason the
  # note above each gives, so they're skipped here for now. They still run
  # on the other OSes and locally. List them with
  #   clj -M:test-ui:<platform>:test-ui-headless --list -i :flaky-mac
  ui-tests:
    name: UI tests (${{ matrix.label }} ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        platform: [mac-arm, win, linux]
        shard: [1, 2, 3, 4]
        shards: [4]
        include:
          - platform: mac-arm
            label: macOS
            os: macos-latest
            shell: bash
            timeout: 40
            skip: ':flaky-mac'
          - platform: win
            label: Windows
            os: windows-latest
            shell: pwsh
            timeout: 15
            skip: ':flaky-windows'
          - platform: linux
            label: Linux
            os: ubuntu-latest
            shell: bash
            timeout: 15
            skip: ':flaky-linux'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}

    # `shell` can't take an expression on a step (GitHub rejects the whole
    # workflow file), but `matrix` is allowed in `defaults.run`.
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
      with:
        cli: '1.12.4.1582'

    - name: Cache Maven dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-

    - name: Run headless UI tests
      run: clojure '-M:${{ matrix.platform }}:test-ui:test-ui-headless' --shard '${{ matrix.shard }}/${{ matrix.shards }}' -e '${{ matrix.skip }}'

    # The add-on loader's tests (output drivers D3) on macOS and Windows too,
    # where jars get locked, paths have drive letters and folders have their
    # own hidden files; the rest of the unit suite runs on Ubuntu only (and
    # these with it). Once per OS, in its first shard. -n loads just that
    # namespace. :test-ui-headless keeps JavaFX headless in case anything it
    # loads pulls in cljfx. Runs even when the UI tests failed. The same
    # quoting works in bash and pwsh (clojure.exe on Windows).
    - name: Run add-on loader tests
      if: ${{ !cancelled() && matrix.shard == 1 && matrix.platform != 'linux' }}
      run: clojure '-M:${{ matrix.platform }}:test:test-ui-headless' -n laser-show.output.addons-test

    # Dev mode (the :dev alias: -Dlaser-show.dev=true, dev/ and cljfx.dev)
    # checks every render against cljfx.dev's specs and dev/'s corrections
    # to them (reactivity plan 31). Only these runs use it, so they keep the
    # specs and corrections honest: the renderer's wiring, the F12 inspector
    # and the Settings tab, in that mode. Once, in Linux's first shard, each
    # in its own JVM. They run even when the UI tests failed.
    - name: Run dev-mode renderer wiring tests
      if: &dev-mode ${{ !cancelled() && matrix.shard == 1 && matrix.platform == 'linux' }}
      run: clojure -M:dev:linux:test:test-ui-headless -n laser-show.renderer-wiring-test

    - name: Run dev-mode inspector test
      if: *dev-mode
      run: clojure -M:dev:linux:test-ui:test-ui-headless -v laser-show.ui-test.menu-bar-test/renderer-inspector-is-dev-only-test

    - name: Run dev-mode Settings tests
      if: *dev-mode
      run: clojure -M:dev:linux:test-ui:test-ui-headless -n laser-show.ui-test.settings-test

    - name: Upload UI test results and screenshots
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ui-test-results-${{ matrix.platform }}-${{ matrix.shard }}
        path: test-results/
        if-no-files-found: ignore
        retention-days: 14

  # Unit and integration tests, then the JAR: about 3 min.
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    # Checkout repository
    - name: Checkout code
      uses: actions/checkout@v7
    
    # Setup Java
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    
    # Setup Clojure
    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
      with:
        cli: '1.12.4.1582'
    
    # Cache Clojure dependencies
    - name: Cache Maven dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-
    
    # Run tests (need :linux for JavaFX deps on ubuntu). cljfx starts JavaFX as
    # soon as it loads and the runner has no display, so every test step uses
    # JavaFX's headless platform (the :test-ui-headless alias). The UI tests
    # run in the ui-tests jobs.
    - name: Run unit tests
      run: clojure -M:linux:test:test-ui-headless
    
    - name: Run integration tests
      run: clojure -M:linux:test-integration:test-ui-headless

    # Build application (platform-specific JAR). AOT-compiling laser-show.app
    # loads JavaFX classes, so run under Xvfb like the release workflow does.
    - name: Build JAR
      run: xvfb-run -a clojure -T:build uber :platform :linux
    
    # Upload JAR artifact
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v7
      with:
        name: laser-show-jar
        path: target/laser-show-*-standalone.jar
        retention-days: 30
